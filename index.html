<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Not Defteri</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
        }
        ul {
            margin-top: 20px;
            padding: 0;
            list-style: none;
        }
        li {
            background: #f0f0f0;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<h1>Not Defteri</h1>
<textarea id="noteInput" placeholder="Notunuzu yazın..."></textarea>
<br />
<button onclick="addNote()">Not Ekle</button>

<ul id="noteList"></ul>

<script>
    const noteInput = document.getElementById('noteInput');
    const noteList = document.getElementById('noteList');

    function addNote() {
        const noteText = noteInput.value.trim();
        if (noteText === '') return;

        const li = document.createElement('li');
        li.textContent = noteText;
        noteList.appendChild(li);

        noteInput.value = '';
    }
</script>
</body>
</html>
